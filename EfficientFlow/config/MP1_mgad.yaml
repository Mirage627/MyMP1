# Complete configuration for MP1_mgad; only the task schema is shared.
defaults:
  - _self_
  - task: mimicgen_pc_abs

name: MP1_mgad
_target_: EfficientFlow.workspace.train_mp1_ablation_workspace.TrainMP1AblationWorkspace
task_name: kitchen_d1
n_demo: 200
shape_meta: ${task.shape_meta}

horizon: 4
n_obs_steps: 2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
dataset_target: EfficientFlow.dataset.robomimic_replay_point_cloud_dataset.RobomimicReplayPointCloudDataset
dataset_path: data/robomimic/datasets/${task_name}/${task_name}_voxel_abs.hdf5

# mp1 retains w=2 and dispersive=.5. Use theory for w=1, dispersive=0.
# Match the SAME profile in all six experiments.
profile: mp1
policy:
  _target_: EfficientFlow.policy.mp1_mgad.Policy
  profile: ${profile}
  # null selects adaptive L2 for mp1 and ordinary MSE for theory.
  baseline_loss: null
  mgad_num_heads: 4
  mgad_mlp_ratio: 2.0
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  diffusion_step_embed_dim: 128
  down_dims: [512, 1024, 2048]
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}
  obs_as_global_cond: true
  shape_meta: ${shape_meta}
  use_pc_color: false
  pointnet_type: mlp
  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm
    normal_channel: false

ema:
  _target_: EfficientFlow.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: cuda:0
  seed: 20
  resume: false
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: ${eval:'int(50000 / ${n_demo})'}
  gradient_accumulate_every: 1
  use_ema: true
  enable_rollouts: true
  enable_validation: true
  rollout_every: ${eval:'int(1000 / ${n_demo})'}
  checkpoint_every: ${eval:'int(1000 / ${n_demo})'}
  val_every: 1
  max_train_steps: null
  max_val_steps: null
  max_grad_norm: 1.0

logging:
  backend: swanlab
  project: MP1_ablation
  mode: online
  name: ${name}_${profile}_${task_name}_demo${n_demo}_s${training.seed}
  group: ${task_name}_demo${n_demo}
  tags: [mp1, "${name}", "${profile}", "${task_name}"]
  id: null
  video_max_fps: 10.0
  video_max_frames: 200
  video_max_side: 256
  strict_media: true

checkpoint:
  # The workspace saves checkpoints/latest.ckpt at the configured interval.
  save_ckpt: true

hydra:
  job:
    chdir: false
  run:
    dir: runs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${profile}_${task_name}_demo${n_demo}_s${training.seed}
  sweep:
    dir: runs/multirun/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${profile}_${task_name}
    subdir: ${hydra.job.num}

